<!doctype html><html lang="en"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Q Remote — persistent signer candidate</title>
<h1>Q Remote — unpaired persistent signer</h1>
<p>Not authorised for Q. Only open from a trusted HTTPS origin.</p>
<button id="setup">Create or load key</button>
<pre id="public"></pre>
<textarea id="objective" rows="8" cols="50">{"id":"Q-TEST","objective":"Read-only demo","acceptance":["No changes"],"dependencies":[],"paid_api_allowance_gbp":0}</textarea>
<button id="sign" disabled>Sign locally</button> <button id="copy" disabled>Copy signed instruction</button><pre id="result"></pre>
<script>
'use strict';
let pair;
const $=id=>document.getElementById(id);
const b64=bytes=>btoa(String.fromCharCode(...new Uint8Array(bytes)));
const canon=value=>{
 if(Array.isArray(value))return '['+value.map(canon).join(',')+']';
 if(value&&typeof value==='object')return '{'+Object.keys(value).sort().map(k=>JSON.stringify(k)+':'+canon(value[k])).join(',')+'}';
 return JSON.stringify(value);
};
function validate(value){
 if(value===null||typeof value==='boolean')return;
 if(typeof value==='number'){if(!Number.isSafeInteger(value))throw Error('Only safe integers are supported');return}
 if(typeof value==='string'){
  if(value.normalize('NFC')!==value||/[\uD800-\uDFFF]/u.test(value))throw Error('Unsupported Unicode string');
  return;
 }
 if(Array.isArray(value)){value.forEach(validate);return}
 if(value&&typeof value==='object'){
  for(const [k,v] of Object.entries(value)){
   if(!/^[a-zA-Z0-9_\-]+$/.test(k))throw Error('Unsupported object key');
   validate(v);
  }
  return;
 }
 throw Error('Unsupported JSON value');
}
function dbOpen(){
 return new Promise((resolve,reject)=>{
  const req=indexedDB.open('q-remote-founder-key',1);
  req.onupgradeneeded=()=>req.result.createObjectStore('keys');
  req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);
 });
}
async function loadOrCreate(){
 if(!isSecureContext||location.protocol!=='https:')throw Error('Trusted HTTPS required');
 const db=await dbOpen();
 try{
  let stored=await new Promise((resolve,reject)=>{
   const tx=db.transaction('keys','readonly');const req=tx.objectStore('keys').get('founder');
   req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);
  });
  if(stored)return stored;
  const generated=await crypto.subtle.generateKey({name:'Ed25519'},false,['sign','verify']);
  await new Promise((resolve,reject)=>{
   const tx=db.transaction('keys','readwrite');
   tx.objectStore('keys').add(generated,'founder');
   tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error);
  });
  return generated;
 }finally{db.close()}
}
$('setup').onclick=async()=>{
 try{
  pair=await loadOrCreate();
  $('public').textContent=b64(await crypto.subtle.exportKey('raw',pair.publicKey));
  $('sign').disabled=false;
 }catch(e){$('public').textContent='Setup error: '+e.message}
};
$('sign').onclick=async()=>{
 try{
  if(!pair)throw Error('Key unavailable');
  const objective=JSON.parse($('objective').value);
  if(!objective||typeof objective!=='object'||Array.isArray(objective))throw Error('Objective must be object');
  validate(objective);
  const envelope={objective,issued_at:Math.floor(Date.now()/1000),nonce:b64(crypto.getRandomValues(new Uint8Array(24)))};
  envelope.signature=b64(await crypto.subtle.sign('Ed25519',pair.privateKey,new TextEncoder().encode(canon(envelope))));
  $('result').textContent=JSON.stringify(envelope,null,2);
  $('copy').disabled=false;
 }catch(e){$('copy').disabled=true;$('result').textContent='Signing error: '+e.message}
};
$('copy').onclick=async()=>{
 try{
  await navigator.clipboard.writeText($('public').textContent+'\n'+$('result').textContent);
  $('copy').textContent='Copied public key + signed instruction';
 }catch(e){$('copy').textContent='Copy failed: '+e.message}
};
</script></html>
